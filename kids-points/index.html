<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>כוכבים בבית</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Assistant:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#F4F3EE; --card:#FFFFFF; --ink:#23272E; --muted:#6F6E68; --line:#E2E0D8; --soft:#ECEBE4;
  --accent:#2C5F78; --accent-ink:#FFFFFF; --accent-soft:#E4EEF3;
  --good:#2F9E6B; --good-soft:#E3F4EA; --good-ink:#1D6B47;
  --bad:#D0553F; --bad-soft:#F9E5E0; --bad-ink:#9A3A2A;
  --gold:#F2B233; --gold-soft:#FBEFD2;
  --shadow:0 1px 2px rgba(35,39,46,.06),0 6px 20px rgba(35,39,46,.06);
  --r:16px; --r-sm:10px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17191C; --card:#212428; --ink:#ECEAE3; --muted:#A3A29B; --line:#33373D; --soft:#2A2E33;
    --accent:#7FB6CB; --accent-ink:#0F1A20; --accent-soft:#1F3038;
    --good:#4CC08A; --good-soft:#1E3A2C; --good-ink:#9FE2C0;
    --bad:#E8735F; --bad-soft:#3E2520; --bad-ink:#F3B3A6;
    --gold:#F5C04A; --gold-soft:#3A3120;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17191C; --card:#212428; --ink:#ECEAE3; --muted:#A3A29B; --line:#33373D; --soft:#2A2E33;
  --accent:#7FB6CB; --accent-ink:#0F1A20; --accent-soft:#1F3038;
  --good:#4CC08A; --good-soft:#1E3A2C; --good-ink:#9FE2C0;
  --bad:#E8735F; --bad-soft:#3E2520; --bad-ink:#F3B3A6;
  --gold:#F5C04A; --gold-soft:#3A3120;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.45;direction:rtl;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.num,button,.tab{font-family:"Rubik","Assistant",system-ui,sans-serif}
h1{font-size:22px;margin:0;font-weight:600;letter-spacing:-.01em}
h2{font-size:18px;margin:0 0 10px;font-weight:600}
h3{font-size:15px;margin:0;font-weight:500;color:var(--muted)}
button{font-size:16px;cursor:pointer;border:0;background:none;color:inherit;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;min-width:0}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 14px calc(84px + env(safe-area-inset-bottom));}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 2px 12px;position:sticky;top:0;background:var(--bg);z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--gold);display:grid;place-items:center;box-shadow:var(--shadow)}
.brand .logo svg{width:22px;height:22px;fill:#5A3E00}
.brand small{display:block;color:var(--muted);font-size:13px;line-height:1.1}
.hdr-r{display:flex;align-items:center;gap:10px}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.on .dot{background:var(--good)}
.guide-btn{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 17px "Rubik";display:grid;place-items:center}
.stack{display:grid;gap:12px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.kid-card{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;width:100%;text-align:right;transition:transform .12s}
.kid-card:active{transform:scale(.985)}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:30px}
.kid-name{font-family:"Rubik";font-size:20px;font-weight:600}
.kid-name small{font-size:13px;color:var(--muted);font-weight:500;margin-inline-start:6px}
.today-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;min-height:22px}
.star{width:20px;height:20px;fill:var(--gold);flex:none}
.mark{width:20px;height:20px;border-radius:50%;background:var(--bad);color:#fff;font:700 13px/20px "Rubik";text-align:center;flex:none}
.more{font:600 13px "Rubik";color:var(--muted)}
.balance{text-align:center;min-width:64px}
.balance .num{font-size:26px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;gap:4px}
.balance .num .star{width:22px;height:22px}
.balance small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.goal{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:14px;margin-top:2px}
.goal .em{font-size:20px}
.goal .bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.goal .bar i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .3s}
.goal .n{font:600 13px "Rubik";color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.goal .lbl{font-weight:600;font-size:14px}
.hint{background:var(--gold-soft);border-radius:var(--r-sm);padding:10px 12px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.hint b{font-weight:700}
.hint .more-link{color:var(--accent);font-weight:600;background:none;font-size:14px;padding:0}
.coach{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:15px;display:grid;gap:6px}
.coach h4{margin:0;font:600 15px "Rubik";display:flex;align-items:center;gap:8px}
.coach ol{margin:0;padding-inline-start:20px}
.coach li{margin:2px 0}
.coach p{margin:0}
.coach .say{background:var(--card);border-radius:var(--r-sm);padding:8px 10px;font-style:normal;border-inline-start:3px solid var(--accent)}
.coach .say b{font-family:"Rubik";font-weight:500;color:var(--muted);font-size:13px;display:block}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:6px 2px 8px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:480px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 10px 12px;display:grid;justify-items:center;gap:6px;text-align:center;border:2px solid transparent;transition:transform .12s,border-color .12s;min-height:118px}
.tile:active{transform:scale(.96)}
.tile .em{font-size:36px;line-height:1}
.tile .lbl{font-size:15px;font-weight:600;line-height:1.25;text-wrap:balance}
.tile .pts{display:flex;gap:2px;align-items:center;font:600 13px "Rubik"}
.tile.good .pts{color:var(--good-ink)}
.tile.bad .pts{color:var(--bad-ink)}
.tile.good:hover{border-color:var(--good)}
.tile.bad:hover{border-color:var(--bad)}
.tile .star{width:16px;height:16px}
.tile .mark{width:16px;height:16px;font-size:11px;line-height:16px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:600;padding:6px 2px}
.kid-head{display:flex;align-items:center;gap:12px;padding:4px 2px 12px}
.kid-head .avatar{width:48px;height:48px;font-size:26px}
.kid-head .grow{flex:1}
.log{display:grid;gap:0}
.log-item{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.log-item:first-child{border-top:0}
.log-item .em{font-size:22px;width:28px;text-align:center}
.log-item .t{font:500 12px "Rubik";color:var(--muted);font-variant-numeric:tabular-nums}
.log-item .who{font-size:13px;color:var(--muted)}
.log-item .d{font:600 14px "Rubik";display:flex;align-items:center;gap:3px;min-width:44px;justify-content:flex-end}
.log-item .d.good{color:var(--good-ink)}.log-item .d.bad{color:var(--bad-ink)}.log-item .d.buy{color:var(--accent)}
.log-item .del{color:var(--muted);font-size:13px;padding:6px}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-size:15px}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--muted);padding:6px 0;font-weight:500}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:15px;background:var(--card)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.sm{padding:4px 12px;font-size:14px}
.btn{border-radius:12px;padding:12px 18px;font-weight:600;font-size:17px;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{padding:8px 14px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:50%;background:var(--soft);font:600 22px "Rubik";display:grid;place-items:center}
.stepper .val{min-width:56px;text-align:center;font:700 22px "Rubik";display:flex;align-items:center;justify-content:center;gap:4px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,22,26,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:grid;gap:14px;max-height:90vh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet .big{display:flex;align-items:center;gap:14px}
.sheet .big .em{font-size:44px;line-height:1}
.sheet .big .lbl{font-family:"Rubik";font-size:20px;font-weight:600;text-wrap:balance}
.sheet label{font-size:14px;color:var(--muted);display:block;margin-bottom:6px}
.sheet textarea{width:100%;height:56px;resize:vertical}
.sheet .row2{display:flex;align-items:center;justify-content:space-between;gap:12px}
/* celebration */
.flash{position:fixed;inset:0;z-index:30;display:grid;place-items:center;pointer-events:none}
.flash .box{background:var(--card);border-radius:24px;padding:26px 34px;box-shadow:var(--shadow);text-align:center;animation:pop .35s cubic-bezier(.2,1.4,.4,1);max-width:86vw}
.flash .box .em{font-size:64px;line-height:1}
.flash .box .msg{font-family:"Rubik";font-size:22px;font-weight:600;margin-top:8px}
.flash .box .sub{color:var(--muted);margin-top:2px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
/* shop */
.shop-item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.shop-item:first-child{border-top:0}
.shop-item .em{font-size:30px;width:38px;text-align:center}
.shop-item .lbl{font-weight:600}
.shop-item .cost{display:flex;align-items:center;gap:3px;font:600 14px "Rubik";color:var(--muted)}
.goal-card{border:2px solid var(--gold);background:var(--gold-soft)}
.goal-card .goal{margin-top:8px}
.tier{border-radius:var(--r-sm);padding:10px 12px;margin-top:8px;border:1.5px solid var(--line)}
.tier.rec{border-color:var(--bad);background:var(--bad-soft)}
.tier h4{margin:0 0 6px;font:600 14px "Rubik";display:flex;justify-content:space-between;align-items:center}
.tier .badge{font-size:12px;background:var(--bad);color:#fff;border-radius:999px;padding:2px 10px}
.tier ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.tier li{display:flex;align-items:center;gap:8px;font-size:15px}
.tier li .warn{font-size:12px;color:var(--bad-ink);background:var(--card);border-radius:999px;padding:1px 8px}
.tier li button{margin-inline-start:auto;font-size:13px;color:var(--accent);font-weight:600;padding:4px 8px}
.pill{font-size:12px;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--muted);font-weight:600}
/* journal */
.day-h{font:600 14px "Rubik";color:var(--muted);margin:14px 2px 6px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:84px;margin-top:6px}
.week .col{display:grid;gap:3px;justify-items:center;align-content:end;height:100%}
.week .bar{width:100%;border-radius:4px 4px 2px 2px;background:var(--gold);min-height:2px}
.week .bar.b{background:var(--bad);border-radius:2px 2px 4px 4px}
.week .dl{font:500 11px "Rubik";color:var(--muted)}
.week .n{font:600 12px "Rubik"}
/* settings */
.row{display:grid;grid-template-columns:58px 1fr 64px 34px;gap:8px;align-items:center;padding:6px 0}
.row input{padding:7px 8px}
.row .em{text-align:center;font-size:20px}
.row .x{color:var(--muted);text-align:center}
.row.kid{grid-template-columns:58px 1fr 64px 34px}
.row .tip{grid-column:1/-1;font-size:13px;color:var(--muted);padding:0 4px 4px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.toggle p{margin:4px 0 0;color:var(--muted);font-size:14px}
.switch{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on{background:var(--good)}
.switch.on::after{transform:translateX(-18px)}
details{border-top:1px solid var(--line);padding:10px 0}
details summary{cursor:pointer;font-family:"Rubik";font-weight:600;list-style:none;display:flex;justify-content:space-between}
details summary::after{content:"+";color:var(--muted)}
details[open] summary::after{content:"–"}
.research p,.guide p{margin:8px 0;font-size:15px}
.research ul,.guide ul,.guide ol{padding-inline-start:20px;margin:6px 0;font-size:15px}
.research li,.guide li{margin:4px 0}
.research a,.guide a{color:var(--accent)}
.guide h2{margin-top:4px}
.guide .say{background:var(--soft);border-radius:var(--r-sm);padding:8px 12px;margin:6px 0;border-inline-start:3px solid var(--accent)}
.guide .say b{font-family:"Rubik";font-weight:500;color:var(--muted);font-size:13px;display:block}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.note{font-size:14px;color:var(--muted)}
.onb{display:grid;gap:14px}
.onb .kids{display:grid;gap:8px}
.signin{display:grid;gap:14px;text-align:center;padding:30px 16px}
.signin .logo{width:64px;height:64px;border-radius:18px;background:var(--gold);display:grid;place-items:center;margin:0 auto}
.signin .logo svg{width:38px;height:38px;fill:#5A3E00}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="app" id="app"></div>
<nav class="nav" id="nav"></nav>

<script src="firebase-config.js"></script>
<script>
(function(){
'use strict';
document.documentElement.setAttribute('dir','rtl');
document.documentElement.setAttribute('lang','he');

/* ---------- defaults ---------- */
const PRAISE_TIP = 'שבח ספציפי, בתוך שניות, עם חיוך או מגע: אומרים מה בדיוק היה טוב. בלי "אבל".';
const DEFAULT_KIDS = () => ([
  {id:'k-tom',  name:'תום', em:'🦁', age:6, goal:{em:'🚜', label:'טרקטור ורוד', cost:40}},
  {id:'k-noga', name:'נגה', em:'🐰', age:4, goal:{em:'🚙', label:'מכונית ג׳ונגל של יחידת החילוץ', cost:30}},
]);
const DEFAULTS = () => ({
  v: 2,
  parents: ['אמא','אבא'],
  kids: DEFAULT_KIDS(),
  deduct: false,
  good: [
    {id:'g1', em:'🛏️', label:'סידרתי את החדר יפה', pts:3, tip:'סידר/ה רק חלק? תנו כוכב על החלק ואמרו מה בדיוק סודר. משפרים בצעדים קטנים.'},
    {id:'g2', em:'🚪', label:'נכנסתי לחדר בפעם הראשונה שביקשו', pts:2, tip:'זה ההפך החיובי של הבעיה העיקרית שלכם. בשבועיים הראשונים "ייצרו" הזדמנויות: בקשו כשקל להצליח, ותנו כוכב מיד כשזה קורה.'},
    {id:'g3', em:'🤝', label:'שיחקתי יפה עם אח או אחות', pts:2, tip:'שימו לב לרגעים של משחק רגוע ותנו כוכב באמצע, לא רק בסוף. "אתם משחקים יפה ביחד, כוכב לשניכם".'},
    {id:'g4', em:'🗣️', label:'דיברתי בנימוס גם כשכעסתי', pts:2, tip:'זה הכי קשה וגם הכי שווה. גם "אני כועס!" בלי קללה זה הצלחה. אמרו: "כעסת ודיברת יפה, זה גדול".'},
    {id:'g5', em:'🙋', label:'ביקשתי עזרה במקום להתפרץ', pts:2, tip:''},
    {id:'g6', em:'🧼', label:'שמרתי על הבית נקי ושקט', pts:1, tip:'ידיים נשטפו לפני הספה? דלת נסגרה בשקט? כוכב מיד, זה מלמד יותר מכל הערה.'},
    {id:'g7', em:'🧸', label:'שמרתי על החפצים והציוד', pts:1, tip:''},
    {id:'g8', em:'✅', label:'עשיתי מה שביקשו מיד', pts:1, tip:''},
    {id:'g9', em:'🧹', label:'עזרתי בבית בלי שביקשו', pts:2, tip:''},
    {id:'g10', em:'🌙', label:'הלכתי לישון בזמן בלי ויכוח', pts:2, tip:''},
  ],
  bad: [

/* ---------- state & storage ---------- */
let S = null;

let sync = { mode:'local', ref:null, user:null, auth:null };
let parentOnDevice = lget('kp-parent') || null;

function lget(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lset(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function migrate(s){
  if(!s || !s.v) return DEFAULTS();
  const d = DEFAULTS();
  if(s.v < 2){
    if(!s.kids || !s.kids.length) s.kids = DEFAULT_KIDS();
    s.v = 2;
  }
  s.kids.forEach(k=>{ if(k.age==null) k.age=null; if(!('goal' in k)) k.goal=null; });
  ['good','bad'].forEach(key=>{ (s[key]||[]).forEach(x=>{ const def=d[key].find(y=>y.id===x.id); if(x.tip==null) x.tip = def ? def.tip : ''; if(key==='bad' && x.say==null) x.say = def ? def.say : ''; }); });
  return s;
}
function loadLocal(){
  const raw = lget(KEY);
  if(raw){ try{ return migrate(JSON.parse(raw)); }catch(e){} }
  return DEFAULTS();
}
let saveTimer = null;
function save(){
  pruneLog();
  lset(KEY, JSON.stringify(S));
  if(sync.ref){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>{ sync.ref.set(JSON.parse(JSON.stringify(S))).catch(()=>{}); }, 150);
  }
  render();
}
function pruneLog(){
  const cutoff = dayKey(new Date(Date.now() - 120*86400000));
  S.log = S.log.filter(e => e.day >= cutoff);
}
function applyRemote(d){
  if(JSON.stringify(d) !== JSON.stringify(S)){ S = migrate(JSON.parse(JSON.stringify(d))); lset(KEY, JSON.stringify(S)); render(); }
}

/* Firebase (Netlify hosting + Google sign-in, only allowed emails) */
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function initFirebase(){
  const cfg = window.FIREBASE_CONFIG; if(!cfg || !cfg.apiKey) return false;
  sync.mode='loading'; render();
  const v='10.12.2';
  await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-auth-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`);
  firebase.initializeApp(cfg);
  const auth = firebase.auth(); sync.auth = auth;
  const fs = firebase.firestore();
  try{ await auth.getRedirectResult(); }catch(e){}
  auth.onAuthStateChanged(async user=>{
    if(!user){ sync.user=null; sync.ref=null; sync.mode='signin'; render(); return; }
    sync.user=user;
    const ref = fs.collection('families').doc('main');
    try{
      const snap = await ref.get();
      if(snap.exists){ S = migrate(snap.data()); lset(KEY, JSON.stringify(S)); }
      else { await ref.set(JSON.parse(JSON.stringify(S))); }
      sync.ref = ref; sync.mode='shared'; render();
      ref.onSnapshot(sn=>{ if(!sn.exists || sn.metadata.hasPendingWrites) return; applyRemote(sn.data()); }, ()=>{ sync.mode='denied'; render(); });
    }catch(e){ sync.mode='denied'; render(); }
  });
  return true;
}
async function signIn(){
  const p = new firebase.auth.GoogleAuthProvider();
  try{ await sync.auth.signInWithPopup(p); }catch(e){ try{ await sync.auth.signInWithRedirect(p); }catch(e2){ alert('ההתחברות נכשלה. נסו שוב.'); } }
}
async function signOut(){ if(sync.auth){ await sync.auth.signOut(); sync.ref=null; } }

/* claude.ai artifact db (fallback when no Firebase config) */
async function initArtifactDb(){
  try{
    if(!(window.claude && typeof window.claude.use === 'function')) return;
    const db = await window.claude.use('db');
    if(!db) return;
    const ref = db.doc('family/main');
    const snap = await ref.get();
    if(snap.exists){ S = migrate(snap.data()); lset(KEY, JSON.stringify(S)); }
    else { await ref.set(S); }
    sync.ref = ref; sync.mode = 'shared';
    ref.onSnapshot(sn => { if(!sn.exists || sn.metadata.hasPendingWrites) return; applyRemote(sn.data()); }, ()=>{ sync.mode='local'; render(); });
    render();
  }catch(e){ sync.mode='local'; render(); }
}

/* ---------- helpers ---------- */
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
function dayKey(d){ const z = n => String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
const today = () => dayKey(new Date());
function fmtTime(iso){ const d=new Date(iso); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtDay(k){ const [y,m,d]=k.split('-'); const dt=new Date(+y,+m-1,+d); const names=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת']; const t=today(); const yk=dayKey(new Date(Date.now()-86400000)); const pre = k===t?'היום · ':k===yk?'אתמול · ':''; return pre+'יום '+names[dt.getDay()]+' '+(+d)+'.'+(+m); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const starSvg = (cls='star') => `<svg class="${cls}" aria-hidden="true"><use href="#i-star"/></svg>`;
const markEl = () => `<span class="mark" aria-label="סימן">!</span>`;
function kidById(id){ return S.kids.find(k=>k.id===id); }
function entriesToday(kidId){ const t=today(); return S.log.filter(e=>e.kid===kidId && e.day===t); }
function starsToday(kidId){ return entriesToday(kidId).filter(e=>e.type==='good').reduce((a,e)=>a+e.pts,0); }
function marksToday(kidId){ return entriesToday(kidId).filter(e=>e.type==='bad').reduce((a,e)=>a+e.pts,0); }
function balance(kidId){ return S.log.filter(e=>e.kid===kidId).reduce((a,e)=>a+(e.delta||0),0); }
function recLevel(marks){ return marks<=0?0:marks===1?1:marks<=3?2:marks<=5?3:4; }
function starsRow(n, max=8){
  if(n<=0) return `<span class="more">עוד לא נאספו כוכבים היום</span>`;
  let h=''; for(let i=0;i<Math.min(n,max);i++) h+=starSvg();
  if(n>max) h+=`<span class="more">+${n-max}</span>`;
  return h;
}
function marksRow(n, max=6){
  let h=''; for(let i=0;i<Math.min(n,max);i++) h+=markEl();
  if(n>max) h+=`<span class="more">+${n-max}</span>`;
  return h;
}
function currentParent(){ return parentOnDevice && S.parents.includes(parentOnDevice) ? parentOnDevice : S.parents[0]; }
function goalBar(k){
  if(!k.goal || !k.goal.label) return '';
  const b=balance(k.id), pct=Math.min(100, Math.round(b/k.goal.cost*100));
  return `<div class="goal"><span class="em">${k.goal.em}</span><div><div class="lbl">${esc(k.goal.label)}</div><div class="bar"><i style="width:${pct}%"></i></div></div><span class="n">${b}/${k.goal.cost}</span></div>`;
}
function timeoutMin(k){ return k.age ? k.age : 5; }

/* ---------- actions ---------- */
function addEntry(kidId, item, type, by, note, ptsOverride){
  const now = new Date();
  const pts = ptsOverride!=null ? ptsOverride : (item.pts!=null ? item.pts : 0);
  let delta = 0;
  if(type==='good') delta = pts;
  if(type==='bad' && S.deduct) delta = -Math.min(pts, Math.max(0, balance(kidId)));
  if(type==='buy') delta = -item.cost;
  S.log.push({id:uid(), t:now.toISOString(), day:dayKey(now), kid:kidId, type, em:item.em, label:item.label,
    pts: type==='good'||type==='bad' ? pts : 0, delta, by, note: note||'', itemId:item.id||''});
}
function removeEntry(id){ S.log = S.log.filter(e=>e.id!==id); save(); }

function render(){

  let body='';
  if(ui.view==='home') body = ui.kid ? kidView(ui.kid) : homeView();
  else if(ui.view==='shop') body = shopView();
  else if(ui.view==='journal') body = journalView();
  else if(ui.view==='settings') body = settingsView();
  else if(ui.view==='guide') body = guideView();
  app.innerHTML = header() + body;
  nav.innerHTML = navHtml();
  overlay.innerHTML = (ui.sheet ? sheetHtml() : '') + (ui.flash ? flashHtml() : '');
  bind();
}

function logRow(e, showKid){
  const k = kidById(e.kid);
  const d = e.type==='good' ? `<span class="d good">+${e.pts}${starSvg()}</span>`
        : e.type==='bad' ? `<span class="d bad">${e.pts}${markEl()}${e.delta?`<small style="margin-inline-start:4px">(${e.delta})</small>`:''}</span>`
        : e.type==='buy' ? `<span class="d buy">${e.delta}${starSvg()}</span>`
        : `<span class="d bad">תוצאה</span>`;
  return `<div class="log-item"><span class="em">${e.em}</span>
    <div><div>${showKid&&k?`<b>${esc(k.name)}</b> · `:''}${esc(e.label)}${e.note?` <span class="who">– ${esc(e.note)}</span>`:''}</div><div class="who"><span class="t">${fmtTime(e.t)}</span> · ${esc(e.by||'')}</div></div>
    ${d}<button class="del" data-del="${e.id}" aria-label="מחיקה">✕</button></div>`;
}

function journalView(){
  const days = []; for(let i=6;i>=0;i--) days.push(dayKey(new Date(Date.now()-i*86400000)));
  const maxS = Math.max(1, ...days.map(d=>S.log.filter(e=>e.day===d&&e.type==='good').reduce((a,e)=>a+e.pts,0)));
  const week = S.kids.map(k=>{
    const cols = days.map(d=>{ const es=S.log.filter(e=>e.day===d&&e.kid===k.id); const s=es.filter(e=>e.type==='good').reduce((a,e)=>a+e.pts,0), m=es.filter(e=>e.type==='bad').reduce((a,e)=>a+e.pts,0);
      const dn=['א','ב','ג','ד','ה','ו','ש'][new Date(d+'T12:00:00').getDay()];
      return `<div class="col"><span class="n">${s||''}</span><div class="bar" style="height:${Math.round(s/maxS*46)}px"></div>${m?`<div class="bar b" style="height:${Math.min(20,m*5)}px"></div>`:''}<span class="dl">${dn}</span></div>`; }).join('');
    const ws = days.reduce((a,d)=>a+S.log.filter(e=>e.day===d&&e.kid===k.id&&e.type==='good').reduce((x,e)=>x+e.pts,0),0);
    const wm = days.reduce((a,d)=>a+S.log.filter(e=>e.day===d&&e.kid===k.id&&e.type==='bad').reduce((x,e)=>x+e.pts,0),0);
    const ratio = wm ? (ws/wm).toFixed(1) : null;
    const verdict = !ws && !wm ? '' : ratio===null ? 'שבוע בלי סימנים.' : ratio>=3 ? `יחס ${ratio} כוכבים לכל סימן. זה הכיוון הנכון.` : `יחס ${ratio} כוכבים לכל סימן. המטרה היא 3 ומעלה: יותר תפיסה בטוב, פחות רישום של סימנים קטנים.`;
    return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><h2 style="margin:0">${k.em} ${esc(k.name)}</h2><span class="note">השבוע: ${ws} כוכבים · ${wm} סימנים</span></div><div class="week">${cols}</div>${verdict?`<p class="note" style="margin:8px 0 0">${verdict}</p>`:''}</div>`;
  }).join('');
  const byDay = {}; S.log.slice().reverse().forEach(e=>{ (byDay[e.day]=byDay[e.day]||[]).push(e); });
  const keys = Object.keys(byDay).sort().reverse().slice(0,14);
  const list = keys.length ? keys.map(d=>`<div class="day-h">${fmtDay(d)}</div><div class="card"><div class="log">${byDay[d].map(e=>logRow(e,true)).join('')}</div></div>`).join('') : `<div class="empty">היומן ריק. כל מעשה שנרשם יופיע כאן.</div>`;
  return `<div class="stack">${week}<h2 style="margin:8px 2px 0">כל הרישומים</h2>${list}</div>`;
}

      <h2>מה זה "לתפוס אותם בטוב"?</h2>
      <p>הרגל של רוב ההורים: כשהילד משחק בשקט לא אומרים כלום, וכשהוא מרביץ מגיבים חזק. מבחינת הילד, תשומת לב מגיעה רק דרך בעיות. "לתפוס אותם בטוב" הוא ההפך המכוון: <b>לשים לב לרגע שבו הילד עושה את הדבר הנכון, גם קטן וגם רגיל, ולהגיב עליו מיד.</b></p>
      <p>למה זה עובד: התנהגות שמקבלת תשומת לב מתחזקת. ילד שמקבל כוכב על "נכנסת בפעם הראשונה" ילמד את זה מהר יותר מילד שמקבל סימן על "לא נכנסת". המחקר על משפחות וכיתות מוצא שהיחס שמשנה התנהגות הוא בערך <b>3 עד 4 תגובות חיוביות על כל תיקון אחד</b>. מתחת לזה, ילד מפסיק לנסות.</p>
      <p>איך עושים את זה בפועל:</p>
      <ul>
        <li>בחרו את הבעיה העיקרית והגדירו את ה"הפך החיובי" שלה (לא נכנס לחדר ← נכנס בפעם הראשונה).</li>
        <li>בשבועיים הראשונים <b>ייצרו הזדמנויות קלות</b>: בקשו כשהילד לא באמצע משהו, עמדו קרוב, ותנו כוכב ברגע שזה קורה.</li>
        <li>שבח ספציפי: לא "כל הכבוד" אלא "נכנסת לחדר בפעם הראשונה שביקשתי. זה כוכב!". עם חיוך או יד על הכתף.</li>
        <li>מהר: כוכב תוך שניות מהמעשה. בגיל 4 גם דקה זה הרבה.</li>
        <li>כשיש יום קשה, הכוכב הבא הכי חשוב. אחרי סימן, חפשו בכוונה את הדבר הבא שנעשה נכון.</li>
      </ul>
    </div>
    <div class="card">
      <h2>איך נותנים כוכב</h2>
      <div class="say"><b>למשל</b>"סידרת את כל הצעצועים לבד. זה כוכב!" (מה בדיוק היה טוב + החיזוק)</div>
      <ul>
        <li>${PRAISE_TIP}</li>
        <li>הילד/ה לוחצים בעצמם על הכוכב באפליקציה? מצוין. זה חלק מהכיף.</li>
        <li>אפשר לשנות את כמות הכוכבים בזמן הרישום: מעשה קשה במיוחד שווה יותר.</li>
        <li>בלי "אבל": "סידרת יפה, אבל למה לא אתמול" מוחק את הכוכב בראש שלו.</li>
      </ul>
    </div>
    <div class="card">
      <h2>איך רושמים סימן</h2>
      <div class="say"><b>למשל</b>"הכאבת לנגה. זה סימן. עכשיו אתה עוזר לה להרגיש טוב." (משפט אחד, קול שקט, ואז ממשיכים)</div>
      <ul>
        <li><b>מיד, קצר, שקט.</b> בלי הרצאה, בלי "כמה פעמים אמרתי". הילד כבר לא מקשיב אחרי המשפט הראשון.</li>
        <li><b>תוצאה אחת</b> מהסולם, קרובה בזמן למעשה, ומבצעים אותה. לא מאיימים בתוצאה שלא תתבצע.</li>
        <li><b>לא מערימים.</b> שני סימנים לא שווים תוצאה כפולה. הסולם בחנות מציע דרגה אחת ליום.</li>
        <li><b>כוכבים לא נלקחים.</b> מה שהורווח נשאר. זה מה שמאפשר לילד להתאושש באותו יום.</li>
        <li>אחרי סימן: הדבר הבא שנעשה נכון מקבל כוכב. זה לא "פרס על התנהגות רעה", זה הלימוד עצמו.</li>
      </ul>
    </div>
    <div class="card">
      <h2>הפסקה שקטה (Time-out) שעובדת</h2>
      <ul>
        <li>אורך: דקה לכל שנת גיל. ${kids.map(k=>`${esc(k.name)}: ${timeoutMin(k)} דקות`).join(', ')}.</li>
        <li>מקום משעמם אבל לא מפחיד. ליד, לא מאחורי דלת סגורה.</li>
        <li>אזהרה אחת לפני. אם ההתנהגות ממשיכה: "הפסקה", ומלווים ביד, בלי דיבור.</li>
        <li>בסוף: לא דורשים התנצלות, לא מדברים על מה שהיה. חוזרים לשגרה ומחפשים כוכב.</li>
      </ul>
    </div>
    ${kids.length?`<div class="card">
      <h2>מה מתאים לכל גיל</h2>
      ${younger&&younger.age?`<p><b>${esc(younger.name)} (${younger.age}):</b> צריך/ה לראות תוצאה תוך דקות, לא בערב. כוכב מיד, פרס קטן כמעט כל יום, מקסימום 2 עד 3 מעשים בפוקוס. הסולם שלה הוא בעיקר דרגה 1: תיקון והפסקה קצרה. חיסכון ליעד הגדול עובד רק אם הפס מתקדם כל יום ומדברים עליו.</p>`:''}
      ${older&&older.age&&older!==younger?`<p><b>${esc(older.name)} (${older.age}):</b> מבין/ה כבר חיסכון של שבוע ומחירים. אפשר לתת לו/ה לבחור בעצמו/ה בחנות, להסביר את הסולם מראש, ולשתף אותו/ה בקביעת המחירים. הוגנות חשובה לו/ה מאוד: אותם כללים לשניכם ולשני הילדים.</p>`:''}
      <p><b>אח גדול ואחות קטנה:</b> אל תשוו ("תראה איך נגה יושבת יפה"). כל ילד מול עצמו. כשמשחקים יפה ביחד, כוכב לשניהם באותו רגע.</p>
    </div>`:''}
    <div class="card">
      <h2>10 דקות של זמן מיוחד</h2>
      <p>הכלי עם הכי הרבה ראיות מאחוריו (מתוכניות כמו PCIT): <b>10 דקות ביום, כל הורה עם כל ילד, בלי מסך, הילד בוחר את המשחק וההורה רק מצטרף ומתאר</b>. לא תלוי בהתנהגות ולא נלקח כעונש. זה מה שמוריד את כמות ההתנהגויות הקשות, יותר מכל תוצאה.</p>
    </div>
    <div class="card">
      <h2>כשזה לא עובד</h2>
      <ul>
        <li><b>אין כוכבים?</b> המעשים קשים מדי. הורידו את הרף ("התחיל לסדר" במקום "סידר הכול").</li>
        <li><b>יש כוכבים ולא אכפת לו?</b> הפרסים לא מרגשים. שאלו אותו מה הוא רוצה, והחליפו.</li>
        <li><b>הרבה סימנים?</b> תפסיקו לרשום את הקטנים. סימן רק על 2 עד 3 ההתנהגויות שבפוקוס. השאר: להתעלם או להזכיר.</li>
        <li><b>עובד שבועיים ואז נשחק?</b> נורמלי. שנו פרסים, הוסיפו מעשה חדש לפוקוס, והורידו לאט כוכבים ממה שכבר הפך להרגל. השבח המילולי נשאר.</li>
        <li><b>ההורים לא מסכימים?</b> קבעו 10 דקות בערב, בלי ילדים, לעבור על היומן ביחד ולסגור את המספרים למחר.</li>
      </ul>
    </div>
    <div class="card research">
      <h2>על מה זה מבוסס</h2>
      <ul>
        <li><a href="https://publications.aap.org/pediatrics/article/142/6/e20183112/37452/Effective-Discipline-to-Raise-Healthy-Children" target="_blank" rel="noopener">AAP: Effective Discipline to Raise Healthy Children (2018)</a>: תוצאות קשורות, קצרות ומיידיות; הפסקה של דקה לשנה; בלי צעקות ובושה.</li>
        <li><a href="https://alankazdin.com/portfolio-items/parenting-defiant-child/" target="_blank" rel="noopener">Kazdin (Yale): The Kazdin Method for Parenting the Defiant Child</a>: ההפך החיובי, שבח ספציפי ומיידי, נקודות שלא נלקחות.</li>
        <li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12156682/" target="_blank" rel="noopener">Token economy and aggressive behavior in children (2025)</a>: מערכת אסימונים מפחיתה תוקפנות כשהיא מיידית ועקבית.</li>
        <li><a href="https://www.apa.org/act/resources/fact-sheets/positive-discipline" target="_blank" rel="noopener">APA: Positive Discipline by Age</a></li>
        <li><a href="https://www.annabellepsychology.com/parenting/token-economy" target="_blank" rel="noopener">Token economy for kids: response cost only after several weeks</a></li>
      </ul>
      <p class="note">סיפור לפני השינה נמצא בסולם כי ביקשתם, אבל מסומן "לא מומלץ": טקס השינה הוא זמן חיבור, וחיבור לא הופכים למטבע.</p>
    </div>
  </div>`;
}

function sheetHtml(){
  const sh = ui.sheet; const k = kidById(sh.kid);
  const isGood = sh.type==='good';
  const tip = sh.item.tip || (isGood ? PRAISE_TIP : 'משפט אחד, קול שקט, ואז ממשיכים. תוצאה אחת מהסולם, קרובה בזמן.');
  const say = isGood ? `${sh.item.label.replace(/^(סידרתי|נכנסתי|שיחקתי|דיברתי|ביקשתי|שמרתי|עשיתי|עזרתי|הלכתי)/, m=>({'סידרתי':'סידרת','נכנסתי':'נכנסת','שיחקתי':'שיחקת','דיברתי':'דיברת','ביקשתי':'ביקשת','שמרתי':'שמרת','עשיתי':'עשית','עזרתי':'עזרת','הלכתי':'הלכת'}[m]))}. זה כוכב!` : (sh.item.say || `${sh.item.label.replace(/^(הכאבתי|קראתי|קלקלתי|אמרתי|לכלכתי)/, m=>({'הכאבתי':'הכאבת','קראתי':'קראת','קלקלתי':'קלקלת','אמרתי':'אמרת','לכלכתי':'לכלכת'}[m]))}. סימן.`);
  return `<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">
    <div class="big"><span class="em">${sh.item.em}</span><div><div class="lbl">${esc(sh.item.label)}</div><div class="note">${k.em} ${esc(k.name)}</div></div></div>
    <div class="row2"><label style="margin:0">${isGood?'כמה כוכבים?':'כמה סימנים?'}</label><div class="stepper"><button data-step="-1" aria-label="פחות">−</button><span class="val">${sh.pts}${isGood?starSvg():markEl()}</span><button data-step="1" aria-label="יותר">+</button></div></div>
    <div class="coach"><h4>${isGood?'💬 איך אומרים את זה':'💬 איך אומרים את זה (משפט אחד)'}</h4><div class="say"><b>${isGood?'עם חיוך, מיד':'קול שקט, ואז ממשיכים'}</b>${esc(say)}</div><p>${esc(tip)}</p>${!isGood&&S.deduct?`<p class="note">ההגדרה "סימן מוריד כוכבים" פעילה: יורדו עד ${sh.pts} כוכבים.</p>`:''}</div>
    <div><label>מי רושם?</label><div class="chips">${S.parents.map(p=>`<button class="chip ${sh.by===p?'on':''}" data-by="${esc(p)}">${esc(p)}</button>`).join('')}</div></div>
    <div><label>הערה (לא חובה)</label><textarea id="sheet-note" placeholder="${isGood?'למשל: סידר את החדר בלי שביקשו':'למשל: מה קרה בקצרה'}">${esc(sh.note||'')}</textarea></div>
    <button class="btn block ${isGood?'good':'bad'}" data-act="confirm">${isGood?`לתת ${sh.pts} כוכבים`:'לרשום סימן'}</button>
    <button class="btn ghost block" data-act="close-sheet">ביטול</button>
  </div></div>`;
}
function flashHtml(){
  const f = ui.flash;
  return `<div class="flash"><div class="box"><div class="em">${f.em}</div><div class="msg">${esc(f.msg)}</div><div class="sub">${esc(f.sub||'')}</div></div></div>`;
}
function flash(em,msg,sub,ms){ ui.flash={em,msg,sub}; render(); setTimeout(()=>{ ui.flash=null; render(); }, ms||1400); }

/* ---------- events ---------- */
function bind(){
  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{ ui.view=b.dataset.nav; ui.kid=null; render(); window.scrollTo(0,0); });
  document.querySelectorAll('[data-kid]').forEach(b=>b.onclick=()=>{ ui.kid=b.dataset.kid; render(); window.scrollTo(0,0); });
  document.querySelectorAll('[data-log]').forEach(b=>b.onclick=()=>{
    const type=b.dataset.log, item=(type==='good'?S.good:S.bad).find(x=>x.id===b.dataset.item);
    ui.sheet={kid:ui.kid, type, item, pts:item.pts, by:currentParent(), note:''}; render();
  });
  document.querySelectorAll('[data-by]').forEach(b=>b.onclick=()=>{ ui.sheet.by=b.dataset.by; ui.sheet.note=document.getElementById('sheet-note').value; parentOnDevice=b.dataset.by; lset('kp-parent',parentOnDevice); render(); });
  document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{ ui.sheet.note=document.getElementById('sheet-note').value; ui.sheet.pts=Math.max(ui.sheet.type==='good'?1:1, Math.min(20, ui.sheet.pts+(+b.dataset.step))); render(); });
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act, b));
  document.querySelectorAll('.scrim').forEach(s=>s.onclick=(ev)=>{ if(ev.target===s){ ui.sheet=null; render(); } });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ if(confirm('למחוק את הרישום הזה?')) removeEntry(b.dataset.del); });
  document.querySelectorAll('[data-shopkid]').forEach(b=>b.onclick=()=>{ ui.shopKid=b.dataset.shopkid; render(); });
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{
    const r=S.rewards.find(x=>x.id===b.dataset.buy); const k=kidById(ui.shopKid);
    if(balance(k.id)<r.cost) return;
    if(!confirm(`${k.name} קונה "${r.label}" ב-${r.cost} כוכבים?`)) return;
    addEntry(k.id, r, 'buy', currentParent(), ''); save();
    flash(r.em, `${k.name} קנה/תה: ${r.label}`, 'תהנו!', 1600);
  });
  document.querySelectorAll('[data-buy-goal]').forEach(b=>b.onclick=()=>{
    const k=kidById(ui.shopKid); const g=k.goal; if(!g || balance(k.id)<g.cost) return;
    if(!confirm(`${k.name} הגיע/ה ליעד "${g.label}"! לרשום קנייה ב-${g.cost} כוכבים?`)) return;
    addEntry(k.id, {id:'goal', em:g.em, label:'היעד הגדול: '+g.label, cost:g.cost}, 'buy', currentParent(), ''); save();
    flash('🎉', `${k.name} הגיע/ה ליעד!`, g.label, 2200);
  });
  document.querySelectorAll('[data-cons]').forEach(b=>b.onclick=()=>{
    const c=S.cons.find(x=>x.id===b.dataset.cons); const k=kidById(ui.shopKid);
    addEntry(k.id, c, 'cons', currentParent(), ''); save();
    flash(c.em, 'נרשם', c.label, 1200);
  });
  document.querySelectorAll('[data-setparent]').forEach(b=>b.onclick=()=>{ parentOnDevice=b.dataset.setparent; lset('kp-parent',parentOnDevice); render(); });
  document.querySelectorAll('[data-parent]').forEach(i=>i.onchange=()=>{ const v=i.value.trim()||S.parents[+i.dataset.parent]; if(parentOnDevice===S.parents[+i.dataset.parent]){ parentOnDevice=v; lset('kp-parent',v); } S.parents[+i.dataset.parent]=v; save(); });
  document.querySelectorAll('[data-edit]').forEach(i=>i.onchange=()=>{
    const [key,id,field]=i.dataset.edit.split('.'); const x=S[key].find(o=>o.id===id); if(!x) return;
    let v=i.value;
    if(['pts','cost','lvl'].includes(field)){ v=Math.max(field==='pts'?0:1, Math.min(field==='lvl'?4:99, parseInt(v,10)||0)); }
    else if(field==='age'){ v=parseInt(v,10)||null; }
    else if(field==='label'||field==='name'){ v=v.trim(); if(!v) return render(); }
    x[field]=v; save();
  });
  document.querySelectorAll('[data-goal]').forEach(i=>i.onchange=()=>{
    const [kid,field]=i.dataset.goal.split('.'); const k=kidById(kid); if(!k) return;
    if(!k.goal) k.goal={em:'🎁',label:'',cost:40};
    k.goal[field] = field==='cost' ? Math.max(5, Math.min(500, parseInt(i.value,10)||40)) : i.value.trim();
    save();
  });
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
    const [key,id]=b.dataset.rm.split('.'); const x=S[key].find(o=>o.id===id);
    if(!confirm(`למחוק "${x.label||x.name}"?`)) return;
    S[key]=S[key].filter(o=>o.id!==id); save();
  });
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{
    const key=b.dataset.add, id=uid();
    if(key==='kids') S.kids.push({id, name:'ילד/ה', em:AVATARS[S.kids.length%AVATARS.length], age:null, goal:{em:'🎁',label:'',cost:40}});
    if(key==='good') S.good.push({id, em:'⭐', label:'מעשה טוב חדש', pts:1, tip:''});
    if(key==='bad') S.bad.push({id, em:'⚠️', label:'התנהגות חדשה', pts:1, tip:'', say:''});
    if(key==='rewards') S.rewards.push({id, em:'🎁', label:'פרס חדש', cost:3, tier:'day'});
    if(key==='cons') S.cons.push({id, em:'⏸️', label:'תוצאה חדשה', lvl:2});
    save();
    const el=document.querySelector(`[data-edit="${key}.${id}.label"],[data-edit="${key}.${id}.name"]`); if(el){ el.focus(); el.select(); }
  });
}
function act(a, b){
  if(a==='back'){ ui.kid=null; render(); }
  else if(a==='close-sheet'){ ui.sheet=null; render(); }
  else if(a==='confirm'){
    const sh=ui.sheet; const note=document.getElementById('sheet-note').value.trim(); const k=kidById(sh.kid);
    addEntry(sh.kid, sh.item, sh.type, sh.by, note, sh.pts); ui.sheet=null; save();
    if(sh.type==='good') flash('⭐', `כל הכבוד, ${k.name}!`, `+${sh.pts} על ${sh.item.label}`, 1500);
    else flash('📝', 'נרשם', `עכשיו: תוצאה אחת קצרה, ואז מחפשים את הכוכב הבא.`, 1900);
  }
  else if(a==='toggle-deduct'){ S.deduct=!S.deduct; save(); }
  else if(a==='guide'){ ui.guideFrom={view:ui.view,kid:ui.kid}; ui.view='guide'; render(); window.scrollTo(0,0); }
  else if(a==='guide-ratio'){ ui.guideFrom={view:ui.view,kid:ui.kid}; ui.view='guide'; render(); const el=document.getElementById('guide-ratio'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }
  else if(a==='guide-back'){ const f=ui.guideFrom||{view:'home'}; ui.view=f.view; ui.kid=f.kid||null; render(); window.scrollTo(0,0); }
  else if(a==='signin'){ signIn(); }
  else if(a==='signout'){ signOut(); }
  else if(a==='export'){ const ta=document.getElementById('backup'); ta.value=JSON.stringify(S); ta.select(); try{ document.execCommand('copy'); }catch(e){} }
  else if(a==='import'){ const ta=document.getElementById('backup'); try{ const s=JSON.parse(ta.value); if(!s||!s.v||!Array.isArray(s.log)) throw 0; if(confirm('לשחזר מהגיבוי? זה יחליף את כל הנתונים הנוכחיים.')){ S=migrate(s); save(); } }catch(e){ alert('הגיבוי לא תקין.'); } }
  else if(a==='reset'){ if(confirm('לאפס את כל ההגדרות והרישומים?')){ S=DEFAULTS(); save(); } }
  else if(a==='onb-add'){ const box=document.getElementById('onb-kids'); const i=box.children.length; const d=document.createElement('div'); d.className='row kid'; d.innerHTML=`<select data-onb-em="${i}">${AVATARS.map((a,j)=>`<option ${j===i%AVATARS.length?'selected':''}>${a}</option>`).join('')}</select><input data-onb-name="${i}" placeholder="שם" maxlength="20"><input data-onb-age="${i}" type="number" min="2" max="14" placeholder="גיל"><span></span>`; box.appendChild(d); d.querySelector('input').focus(); }
  else if(a==='onb-go'){
    const names=[...document.querySelectorAll('[data-onb-name]')], ems=[...document.querySelectorAll('[data-onb-em]')], ages=[...document.querySelectorAll('[data-onb-age]')];
    const kids=names.map((n,i)=>({id:uid(), name:n.value.trim(), em:ems[i].value, age:parseInt(ages[i].value,10)||null, goal:{em:'🎁',label:'',cost:40}})).filter(k=>k.name);
    if(!kids.length){ names[0].focus(); return; }
    const ps=[...document.querySelectorAll('[data-onb-parent]')].map(p=>p.value.trim()).filter(Boolean);
    S.kids=kids; if(ps.length) S.parents=ps; save();
  }
}

/* ---------- boot ---------- */
S = loadLocal();
render();
initFirebase().then(ok=>{ if(!ok) initArtifactDb(); }).catch(()=>{ sync.mode='local'; render(); });
})();
</script>
</body>
</html>
